spring.application.name=Api

# PostgreSQL - Aiven
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# Supabase Storage
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.bucket=atestados

# Upload de arquivos
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=3600000

app.bootstrap-admin.nome=${BOOTSTRAP_ADMIN_NAME:Administrador}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.senha=${BOOTSTRAP_ADMIN_PASSWORD:}

# Frontend
FRONTEND_URL=https://esconlinefront-school-portal.vercel.app
FRONTEND_PREVIEW_ORIGIN_PATTERN=https://*.vercel.app

# Porta
server.port=${PORT:8081}